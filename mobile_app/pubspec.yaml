name: manrakshak
description: "A new Flutter project for ManRakshak AI."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.1.1
  fl_chart: ^0.65.0
  google_fonts: ^6.1.0
  intl: ^0.20.3
  http: ^1.6.0
  flutter_secure_storage: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  path_provider_android: 2.2.12

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/

