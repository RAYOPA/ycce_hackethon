services:
  db:
    image: postgres:15
    container_name: manrakshak_db
    restart: always
    environment:
      POSTGRES_USER: manrakshak
      POSTGRES_PASSWORD: manrakshak123
      POSTGRES_DB: manrakshak
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
